<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- OFS/T scenery: a calm Atlantic beach with a seaside road. Original illustration; swap this file for a photo any time. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9DBFD8"/><stop offset=".55" stop-color="#C9DCE8"/><stop offset="1" stop-color="#EEF1EF"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E7F9A"/><stop offset=".5" stop-color="#6E9DB2"/><stop offset="1" stop-color="#9CC3CC"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9DCC4"/><stop offset="1" stop-color="#D9C6A6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A8C8F"/><stop offset=".35" stop-color="#76787C"/><stop offset="1" stop-color="#5E6064"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#fff" opacity=".7" filter="url(#soft)">
    <ellipse cx="300" cy="150" rx="230" ry="38"/><ellipse cx="420" cy="175" rx="160" ry="26"/>
    <ellipse cx="1120" cy="110" rx="260" ry="34"/><ellipse cx="1300" cy="140" rx="180" ry="24"/>
    <ellipse cx="760" cy="230" rx="200" ry="22"/>
  </g>

  <!-- volcanic headlands -->
  <path d="M960 470 C1040 420 1100 360 1190 330 C1250 312 1300 300 1360 318 C1430 338 1500 380 1600 400 L1600 470 Z" fill="#9AABB4" filter="url(#soft2)"/>
  <path d="M1080 470 C1160 440 1230 410 1300 400 C1370 392 1450 410 1520 430 C1560 440 1580 446 1600 448 L1600 470 Z" fill="#7F949F"/>
  <path d="M0 470 C70 450 140 432 210 436 C270 440 320 456 380 470 Z" fill="#A9B8BF" filter="url(#soft2)"/>

  <!-- sea -->
  <rect y="468" width="1600" height="150" fill="url(#sea)"/>
  <g stroke="#fff" stroke-linecap="round" opacity=".35">
    <path d="M120 500h140M420 512h90M700 498h180M1040 506h120M1300 520h160" stroke-width="2"/>
    <path d="M60 545h200M380 560h160M760 548h220M1120 566h180M1420 552h120" stroke-width="2.5"/>
    <path d="M200 592h260M640 600h200M1000 590h280M1380 604h180" stroke-width="3"/>
  </g>
  <!-- surf -->
  <path d="M0 612 C120 602 240 620 360 610 C480 600 600 622 720 612 C840 602 960 622 1080 610 C1200 600 1320 620 1440 610 C1520 604 1570 610 1600 612 L1600 630 L0 630 Z" fill="#F4F6F3" opacity=".9"/>

  <!-- sand -->
  <rect y="622" width="1600" height="86" fill="url(#sand)"/>
  <!-- promenade wall -->
  <rect y="700" width="1600" height="16" fill="#D7D8D6"/>
  <rect y="714" width="1600" height="5" fill="#B9BBBA"/>
  <!-- road -->
  <rect y="719" width="1600" height="181" fill="url(#road)"/>
  <path d="M0 728h1600" stroke="#A2A4A6" stroke-width="3"/>
  <!-- light haze so the picture reads as a soft backdrop -->
  <rect width="1600" height="900" fill="url(#haze)"/>
</svg>

<section class="view" data-view="shop">
  <div class="page-head">
    <span class="eyebrow">Shop</span>
    <h1 class="display">All designs</h1>
    <p class="muted" style="margin:0;max-width:56ch">Each kit covers the lower door panel and the rear quarter window. Prices are for one side; add the second side in the configurator.</p>
    <div class="tabs" role="group" id="shopTabs" aria-label="Filter by category">{{shop_tabs}}</div>
  </div>
  <div class="section" style="padding-top:24px">
    <h2 class="sr">Designs</h2>
    <div class="grid-cards" id="shopGrid">
{{shop_cards}}
    </div>
  </div>
</section>

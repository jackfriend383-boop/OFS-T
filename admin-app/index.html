<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="__THEME_DARK__" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="__THEME_LIGHT__" media="(prefers-color-scheme: light)">
<title>OFS/T admin</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icons/OFST-icon-white-on-black-192px.png">

</head>
